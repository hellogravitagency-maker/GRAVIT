    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="We build high-performance digital flagship experiences for global brands. No templates. No compromises." />
    <meta name="twitter:image" content="/og-image.jpg" />
    
    <meta name="theme-color" content="#0A0A0F" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="/images/hero-porsche-400w.webp" imagesrcset="/images/hero-porsche-300w.webp 300w, /images/hero-porsche-400w.webp 400w" imagesizes="(max-width: 640px) 300px, (max-width: 1024px) 340px, 400px" fetchpriority="high">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Syne:wght@400..800&family=Inter:wght@100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Syne:wght@400..800&family=Inter:wght@100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          // Default to dark mode if no theme is saved
          if (theme === 'dark' || !theme) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        // Ignore errors from Instagram/Facebook in-app browser injected scripts
        if (
          (url && typeof url === 'string' && url.includes('iabjs://')) ||
          (msg && typeof msg === 'string' && msg.includes('Java exception was raised')) ||
          (msg && typeof msg === 'string' && msg.includes('navigation_performance_logger')) ||
          (error && error.stack && error.stack.includes('iabjs://'))
        ) {
          console.warn('Ignored in-app browser script error:', msg);
          return true; // return true prevents the error from bubbling up
        }

        document.body.innerHTML = '<div style="color:red;font-size:20px;padding:20px;z-index:999999;position:fixed;top:0;left:0;background:white;width:100%;height:100%;overflow:auto;">' + 
          'Error: ' + msg + '<br>Line: ' + line + '<br>Col: ' + col + '<br><pre>' + (error && error.stack ? error.stack : '') + '</pre>' + 
          '</div>';
      };
    </script>
    <div id="root">
      <div style="min-height:100vh;background-color:#0A0A0F;color:#F8FAFC;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;">
        <nav style="width:100%;max-width:1280px;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
          <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-0.03em;">GRAVIT</div>
        </nav>
        <main style="width:100%;display:flex;flex-direction:column;align-items:center;padding:48px 16px 24px;text-align:center;">
          <h1 style="font-family:'Syne',sans-serif;font-size:clamp(2rem,5.5vw,4.5rem);font-weight:700;line-height:1.05;letter-spacing:-0.03em;margin:0 0 16px;">
            Engineering the<br>
            <span style="background:linear-gradient(135deg,#6366F1,#A855F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Extraordinary</span>
          </h1>
          <p style="font-size:clamp(0.875rem,2vw,1rem);color:#94A3B8;max-width:672px;line-height:1.6;margin:0 0 32px;">
            We craft high-performance digital products for ambitious teams. Strategy, design, and engineering — unified under one roof.
          </p>
          <div style="width:100%;height:335px;display:flex;align-items:center;justify-content:center;position:relative;">
            <div style="width:260px;height:335px;border-radius:24px;overflow:hidden;box-shadow:0 24px 48px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);background:#6355D8;">
              <img 
                src="/images/hero-porsche-400w.webp" 
                srcset="/images/hero-porsche-300w.webp 300w, /images/hero-porsche-400w.webp 400w"
                sizes="(max-width: 640px) 300px, (max-width: 1024px) 340px, 400px"
                style="width:100%;height:100%;object-fit:cover;display:block;" 
                alt="Yellow Porsche GT3 RS" 
                fetchpriority="high" 
                loading="eager" 
                decoding="sync" 
              />
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
