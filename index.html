    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/og-image.jpg" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0A0A0F" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400&family=Outfit:wght@400;700&display=swap" rel="preload" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400&family=Outfit:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body style="background-color: #0A0A0F; margin: 0;">
    <script>
      window.onerror = function(msg, url, line, col, error) {
        // Ignore errors from Instagram/Facebook in-app browser injected scripts
        if (
          (url && typeof url === 'string' && url.includes('iabjs://')) ||
          (msg && typeof msg === 'string' && msg.includes('Java exception was raised')) ||
          (msg && typeof msg === 'string' && msg.includes('navigation_performance_logger')) ||
          (error && error.stack && error.stack.includes('iabjs://'))
        ) {
          console.warn('Ignored in-app browser script error:', msg);
          return true; // return true prevents the error from bubbling up
        }

        document.body.innerHTML = '<div style="color:red;font-size:20px;padding:20px;z-index:999999;position:fixed;top:0;left:0;background:white;width:100%;height:100%;overflow:auto;">' + 
          'Error: ' + msg + '<br>Line: ' + line + '<br>Col: ' + col + '<br><pre>' + (error && error.stack ? error.stack : '') + '</pre>' + 
          '</div>';
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
